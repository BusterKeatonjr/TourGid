<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Интерактивный туристический гид по Крыму</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=599bab60-40ff-47de-842c-8a7cf302146f&lang=ru_RU"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #333; }
        #map { width: 100%; height: 500px; margin-top: 20px; }
        .search-panel { margin-bottom: 20px; }
        input { padding: 8px; width: 350px; }
        button { padding: 8px 15px; margin-left: 10px; cursor: pointer; }
        #answer-container { margin-top: 20px; padding: 10px; border: 1px solid #ddd; background-color: #f9f9f9; }
        .filter-panel {
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
        }
        .filter-panel button {
            margin-right: 5px;
            padding: 5px 10px;
            cursor: pointer;
            border: 1px solid #ddd;
            background-color: white;
            border-radius: 4px;
        }
        .filter-panel button:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>Интерактивный туристический гид по Крыму</h1>

    <div class="search-panel">
        <input type="text" id="query" placeholder="Опишите желаемый маршрут или задайте вопрос...">
        <button id="route-btn">Построить маршрут</button>
        <button id="question-btn">Задать вопрос</button>
    </div>

    <div id="answer-container"></div>
    <div id="map"></div>

    <script src="/public/js/map.js"></script>
</body>
</html>
